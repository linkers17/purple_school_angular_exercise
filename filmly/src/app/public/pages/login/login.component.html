<div class="login">
  <h1 class="login-heading">Вход</h1>
  <div class="login-form">
    <app-input type="email" placeholder="Email" iconUrl="images/icons/user.svg" />
    <app-password-input type="password" placeholder="Пароль" iconUrl="images/icons/lock.svg" />
    <app-button class="login-action" (btnClick)="handleLogin()">Войти</app-button>
  </div>
</div>
