<div class="form-input">
  @if (iconUrl) {
    <div class="form-input__icon">
      <img class="form-input__icon-image" [ngSrc]="iconUrl" [alt]="type" width="24" height="24">
    </div>
  }
  <input
    class="form-input__input"
    [(ngModel)]="value"
    [type]="type"
    [placeholder]="placeholder"
    (input)="onInput($any($event.target).value)"
  >
  <div class="form-input__action">
    <button class="form-input__button" (click)="onButtonToggleClick()">
      <img [ngSrc]="buttonIcon" [alt]="type" width="16" height="16">
    </button>
  </div>
</div>
